version: 1.0.0
foundation:
  colors:
    primary: '#4285f4'
    success: '#34a853'
    accent: '#9c27b0'
    warning: '#ff9800'
    error: '#e91e63'
    neutral: '#333333'
    lightGray: '#f0f0f0'
    darkGray: '#666666'
  strokeWidths:
    thin: 1px
    medium: 2px
    thick: 3px
  strokePatterns:
    solid: ''
    dashed: 5 5
    dotted: 8 4
    longDash: 10 2
    longDashSpaced: 10 5
sharedElements:
  componentCategories:
    componentsInfrastructure:
      fill: '#e6f3e6'
      stroke: '#333333'
      strokeWidth: 2px
    componentsApplication:
      fill: '#e6f0ff'
      stroke: '#333333'
      strokeWidth: 2px
    componentsModel:
      fill: '#ffe6e6'
      stroke: '#333333'
      strokeWidth: 2px
    componentsExternalTools:
      fill: '#f3e6ff'
      stroke: '#333333'
      strokeWidth: 2px
graphTypes:
  component:
    direction: TD
    metadata:
      layout: elk
      mergeEdges: false
      nodePlacementStrategy: BRANDES_KOEPF
    flowchartConfig:
      padding: 5
      wrappingWidth: 250
    specialStyling: {}
