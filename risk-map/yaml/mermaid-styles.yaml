# Mermaid Styles Configuration
# Version 1.0.0 - Initial implementation with extracted hardcoded values
#
# This configuration defines all styling elements for Mermaid graph generation
# used by the ComponentGraph class in the validation system.

version: '1.0.0'

# Design foundation - core design tokens
foundation:
  colors:
    primary: '#4285f4' # Google Blue - primary/brand color token
    success: '#34a853' # Google Green - success color token
    accent: '#9c27b0' # Purple - accent color token
    warning: '#ff9800' # Orange - warning color token
    error: '#e91e63' # Pink - error/emphasis color token
    neutral: '#333333' # Dark gray - used for borders and strokes
    lightGray: '#f0f0f0' # Light gray - background color token
    darkGray: '#666666' # Medium gray - border color token

  strokeWidths:
    thin: '1px' # Thin stroke width token
    medium: '2px' # Medium stroke width token
    thick: '3px' # Thick stroke width token

  strokePatterns:
    solid: '' # No dash pattern (solid lines)
    dashed: '5 5' # Standard dashed pattern
    dotted: '8 4' # Dotted dash pattern token
    longDash: '10 2' # Long dash pattern token
    longDashSpaced: '10 5' # Long dash pattern token, with spacing

# Shared elements used by graph generation
sharedElements:
  # Component category styling
  componentCategories:
    componentsInfrastructure:
      fill: '#e6f3e6' # Light green for infrastructure components
      stroke: '#333333' # Dark gray border
      strokeWidth: '2px' # Medium border width
    componentsApplication:
      fill: '#e6f0ff' # Light blue for application components
      stroke: '#333333' # Dark gray border
      strokeWidth: '2px' # Medium border width
    componentsModel:
      fill: '#ffe6e6' # Light red for model components
      stroke: '#333333' # Dark gray border
      strokeWidth: '2px' # Medium border width
    componentsExternalTools:
      fill: '#f3e6ff' # Light purple for tools components
      stroke: '#333333' # Dark gray border
      strokeWidth: '2px' # Medium border width

# Graph-type-specific configurations
graphTypes:
  # ComponentGraph configuration
  component:
    direction: 'TD' # Top-down layout for component relationships
    metadata:
      layout: 'elk'
      mergeEdges: False
      nodePlacementStrategy: 'BRANDES_KOEPF'
    flowchartConfig:
      padding: 5 # Internal node padding
      wrappingWidth: 250 # Text wrapping width
    specialStyling: {} # No special styling for component graphs
    # Decoupled-emission config (ADR-036 D3). mode: 'decoupled' selects the
    # topological emitter, which renders `LR` regardless of the `direction`
    # key above; mode: 'flat' is the rollback lever, restoring the original
    # emitter and its `direction`-driven layout without touching the
    # registry below (D10).
    emission:
      mode: 'decoupled'
      # Declared aspect (sink) components lifted out of the drawn graph (D4).
      # componentAuditRecordRepository is the sole candidate: out-degree 0,
      # with cross in-degree above the minCrossInDegree threshold below.
      aspects:
        - id: componentAuditRecordRepository
          minCrossInDegree: 10
      # Cross-edge -> trust-concern-label registry (D5), keyed by explicit edge
      # list. Covers every channelled (non-lifted) cross edge in the corpus
      # exactly once; D7's drift guards catch a corpus edge this registry
      # doesn't account for.
      concerns:
        - label: 'model artifacts'
          edges:
            - [componentModelStorage, componentModelServing]
            - [componentModelRegistry, componentModelServing]
        - label: 'training data'
          edges:
            - [componentDataStorage, componentModelTrainingTuning]
        - label: 'runtime hosting'
          edges:
            - [componentRuntimeHosting, componentApplication]
            - [componentRuntimeHosting, componentModelServing]
            - [componentRuntimeHosting, componentReasoningCore]
        - label: 'tool hosting'
          edges:
            - [componentToolHosting, componentToolServer]
        - label: 'endpoint enumeration'
          edges:
            - [componentToolRegistry, componentAgentNetworkPolicyEnforcementPoint]
        - label: 'identity & authz'
          edges:
            - [componentAuthorizationPolicyDecisionPoint, componentAgentNetworkPolicyEnforcementPoint]
            - [componentAuthorizationPolicyDecisionPoint, componentApplicationNetworkPolicyEnforcementPoint]
            - [componentAuthorizationPolicyDecisionPoint, componentAuthorizationPolicyEnforcementPoint]
            - [componentAuthorizationPolicyDecisionPoint, componentModelServing]
            - [componentAuthorizationPolicyDecisionPoint, componentToolNetworkPolicyEnforcementPoint]
            - [componentFederationProxy, componentAgentNetworkPolicyEnforcementPoint]
            - [componentFederationProxy, componentToolNetworkPolicyEnforcementPoint]
            - [componentIdentityProvider, componentAgentNetworkPolicyEnforcementPoint]
            - [componentIdentityProvider, componentApplicationNetworkPolicyEnforcementPoint]
            - [componentIdentityProvider, componentModelServing]
            - [componentIdentityProvider, componentToolNetworkPolicyEnforcementPoint]
        - label: 'model publish'
          edges:
            - [componentModelTrainingTuning, componentModelRegistry]
            - [componentModelTrainingTuning, componentModelStorage]
        - label: 'inference / serving'
          edges:
            - [componentModelServing, componentAgentNetworkPolicyEnforcementPoint]
            - [componentModelServing, componentApplicationNetworkPolicyEnforcementPoint]
        - label: 'tool calls'
          edges:
            - [componentAgentToolTransport, componentToolNetworkPolicyEnforcementPoint]
        - label: 'app + agent egress'
          edges:
            - [componentAgentNetworkPolicyEnforcementPoint, componentModelServing]
            - [componentApplicationNetworkPolicyEnforcementPoint, componentModelServing]
        - label: 'tool registration'
          edges:
            - [componentTools, componentToolRegistry]
        - label: 'tool results'
          edges:
            - [componentToolNetworkPolicyEnforcementPoint, componentAgentToolTransport]
      # Style strings for decoupled-mode channel ports, PEP wrappers, and the
      # lifted-aspect marker (D3).
      portStyles:
        port: 'fill:#fff5f5,stroke:#c0392b,stroke-width:1.5px,stroke-dasharray:4 3'
        pepport: 'fill:#eef7ff,stroke:#2c3e83,stroke-width:1.5px,stroke-dasharray:4 3'
        pepWrapOutline: 'fill:none,stroke:#2c3e83,stroke-width:2px,stroke-dasharray:2 2'
        # Dashed-border marker for a lifted aspect node (D3/D4): amber, distinct
        # from the red port and blue pepport/pepWrapOutline hues, reusing the
        # same stroke-dasharray convention.
        aspectStyle: 'fill:#fdf6e3,stroke:#b58900,stroke-width:1.5px,stroke-dasharray:4 3'
